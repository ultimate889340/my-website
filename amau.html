<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Amau - 200 GB</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #0d0e12;
    color: #f1f1f1;
    font-family: Arial, sans-serif;
}

header {
    height: 64px;
    border-bottom: 1px solid #24262d;
    display: flex;
    align-items: center;
}

.header-inner {
    width: 100%;
    max-width: 1100px;
    margin: auto;
    padding: 0 20px;
}

.logo {
    font-size: 20px;
    font-weight: bold;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 40px 20px 60px;
}

.thumbnail {
    width: 100%;
    height: 430px;
    background: #20232b;
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 25px;
}

.thumbnail img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

h1 {
    font-size: 32px;
    margin-bottom: 10px;
}

.description {
    color: #999;
    font-size: 16px;
    margin-bottom: 25px;
}

.info {
    background: #181a20;
    border: 1px solid #292c34;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 25px;
}

.row {
    display: flex;
    justify-content: space-between;
    padding: 14px 0;
    border-bottom: 1px solid #292c34;
}

.row:last-child {
    border-bottom: none;
}

.label {
    color: #999;
}

.value {
    font-weight: bold;
}

.button {
    display: block;
    width: 100%;
    padding: 16px;
    text-align: center;
    background: #e5e7eb;
    color: #111318;
    text-decoration: none;
    font-weight: bold;
    border-radius: 10px;
}

.button:hover {
    opacity: .9;
}

footer {
    text-align: center;
    color: #666;
    padding: 30px 20px;
    border-top: 1px solid #24262d;
}

@media(max-width:650px) {

    .container {
        padding: 25px 15px 50px;
    }

    .thumbnail {
        height: 300px;
    }

    h1 {
        font-size: 28px;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-inner">
        <div class="logo">MY WEBSITE</div>
    </div>
</header>

<main class="container">

    <div class="thumbnail">
        <img
            src="https://s13.gifyu.com/images/bnygD.jpg"
            alt="Amau"
        >
    </div>

    <h1>Amau</h1>

    <p class="description">
        Amau collection.
    </p>

    <div class="info">

        <div class="row">
            <span class="label">Size</span>
            <span class="value">200 GB</span>
        </div>

        <div class="row">
            <span class="label">Views</span>
            <span class="value">0</span>
        </div>

        <div class="row">
            <span class="label">Added</span>
            <span class="value">September 1, 2026</span>
        </div>

    </div>

    <a
        href="https://lockr.to/QWIZvDDK"
        class="button"
    >
        Access Content
    </a>

</main>

<footer>
    © 2026 My Website
</footer>

</body>
</html>
