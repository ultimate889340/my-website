<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Autumren - 88 GB</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0d0e12;
            color: #f1f1f1;
            font-family: Arial, sans-serif;
        }

        header {
            height: 64px;
            border-bottom: 1px solid #24262d;
            display: flex;
            align-items: center;
        }

        .header-inner {
            width: 100%;
            max-width: 1100px;
            margin: auto;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
        }

        nav a {
            color: #999;
            text-decoration: none;
            margin-left: 25px;
            font-size: 14px;
        }

        nav a:hover {
            color: #fff;
        }

        main {
            max-width: 800px;
            margin: auto;
            padding: 40px 20px 80px;
        }

        .back {
            display: inline-block;
            color: #999;
            text-decoration: none;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .back:hover {
            color: #fff;
        }

        .thumbnail {
            width: 100%;
            aspect-ratio: 2 / 3;
            background: #22252e;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        h1 {
            font-size: 28px;
            margin-top: 25px;
            margin-bottom: 15px;
        }

        .description {
            color: #999;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .info {
            background: #17181d;
            border: 1px solid #272a32;
            border-radius: 10px;
            padding: 5px 18px;
            margin-bottom: 25px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid #272a32;
        }

        .row:last-child {
            border-bottom: none;
        }

        .label {
            color: #858893;
        }

        .value {
            color: #fff;
        }

        .button {
            display: block;
            width: 100%;
            padding: 15px;
            background: #272a32;
            color: #fff;
            text-align: center;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: .15s;
        }

        .button:hover {
            background: #363a45;
        }

        footer {
            border-top: 1px solid #24262d;
            text-align: center;
            padding: 25px 20px;
            color: #666;
            font-size: 13px;
        }

        @media (max-width: 650px) {
            header {
                height: 62px;
            }

            .header-inner {
                padding: 0 18px;
            }

            nav {
                display: none;
            }

            main {
                padding: 30px 15px 60px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="header-inner">

        <div class="logo">
            MY WEBSITE
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="index.html">Categories</a>
            <a href="#">About</a>
        </nav>

    </div>
</header>

<main>

    <a href="index.html" class="back">
        ← Back to home
    </a>

    <div class="thumbnail">
        <img
            src="https://s13.gifyu.com/images/bnygD.jpg"
            alt="Autumren"
        >
    </div>

    <h1>
        Autumren
    </h1>

    <p class="description">
        Autumren collection.
    </p>

    <div class="info">

        <div class="row">
            <span class="label">Size</span>
            <span class="value">88 GB</span>
        </div>

        <div class="row">
            <span class="label">Views</span>
            <span class="value">1.2K</span>
        </div>

        <div class="row">
            <span class="label">Added</span>
            <span class="value">September 1, 2026</span>
        </div>

    </div>

    <a href="https://lockr.to/QWIZvDDK" class="button">
        Access Content
    </a>

</main>

<footer>
    © 2026 My Website
</footer>

</body>
</html>
