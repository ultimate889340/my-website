<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ONLYOFNLEAKS.COM</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #0d0e12;
      color: #f5f5f5;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    header {
      height: 70px;
      border-bottom: 1px solid #24262d;
      background: #101116;
      display: flex;
      align-items: center;
    }

    .header-inner {
      width: 100%;
      max-width: 1200px;
      margin: auto;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
    }

    nav a {
      color: #999;
      margin-left: 25px;
      font-size: 14px;
    }

    nav a:hover {
      color: #fff;
    }

    .hero {
      max-width: 1200px;
      margin: auto;
      padding: 45px 20px 25px;
      text-align: center;
    }

    .hero h1 {
      font-size: 38px;
      margin-bottom: 15px;
    }

    .hero p {
      color: #999;
      font-size: 16px;
    }

    .search-box {
      max-width: 1200px;
      margin: 15px auto 25px;
      padding: 0 20px;
    }

    #search {
      width: 100%;
      padding: 18px 24px;
      border-radius: 12px;
      border: 1px solid #30323a;
      background: #191a20;
      color: white;
      font-size: 16px;
      outline: none;
    }

    #search::placeholder {
      color: #777;
    }

    .content-header {
      max-width: 1200px;
      margin: auto;
      padding: 0 20px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #content-count {
      color: #999;
      font-size: 14px;
    }

    .sort-buttons {
      display: flex;
      gap: 10px;
    }

    .sort-buttons button {
      background: #191a20;
      color: #999;
      border: 1px solid #30323a;
      padding: 11px 16px;
      border-radius: 9px;
      cursor: pointer;
    }

    .sort-buttons button.active,
    .sort-buttons button:hover {
      background: #292c36;
      color: white;
    }

    .grid {
      max-width: 1200px;
      margin: auto;
      padding: 0 20px 50px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .card {
      background: #191a20;
      border: 1px solid #292b33;
      border-radius: 14px;
      overflow: hidden;
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: #444752;
    }

    .thumbnail {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #22252f;
      overflow: hidden;
    }

    .thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-info {
      padding: 15px;
    }

    .card-title {
      font-size: 17px;
      font-weight: 500;
      margin-bottom: 10px;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      color: #999;
      font-size: 13px;
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      color: #777;
      padding: 50px 20px;
    }

    footer {
      border-top: 1px solid #24262d;
      text-align: center;
      color: #666;
      padding: 35px 20px;
      font-size: 14px;
    }

    @media (max-width: 800px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .hero h1 {
        font-size: 32px;
      }

      .content-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
      }
    }

    @media (max-width: 550px) {
      .grid {
        grid-template-columns: 1fr;
      }

      nav {
        display: none;
      }

      .hero {
        padding-top: 35px;
      }

      .hero h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">

    <div class="logo">
      ONLYOFNLEAKS.COM
    </div>

    <nav>
      <a href="index.html">Home</a>
    </nav>

  </div>
</header>


<section class="hero">

  <h1>
    Discover Your Collection
  </h1>

  <p>
    Browse and explore our latest content.
  </p>

</section>


<div class="search-box">

  <input
    type="text"
    id="search"
    placeholder="Search content..."
    autocomplete="off"
  >

</div>


<div class="content-header">

  <div id="content-count">
    0 contents
  </div>

  <div class="sort-buttons">

    <button
      id="recentBtn"
      class="active"
      onclick="sortContents('recent')"
    >
      Recent
    </button>

    <button
      id="viewsBtn"
      onclick="sortContents('views')"
    >
      Most Viewed
    </button>

    <button
      id="azBtn"
      onclick="sortContents('az')"
    >
      A-Z
    </button>

  </div>

</div>


<main>

  <div
    class="grid"
    id="contentGrid"
  ></div>

</main>


<footer>
  © 2026 ONLYOFNLEAKS.COM
</footer>


<script src="data.js"></script>


<script>

let currentContents = [...contents];


function renderContents(data) {

  const grid =
    document.getElementById("contentGrid");

  const count =
    document.getElementById("content-count");


  grid.innerHTML = "";


  count.textContent =
    data.length +
    (data.length === 1 ? " content" : " contents");


  if (data.length === 0) {

    grid.innerHTML = `
      <div class="empty">
        No content found.
      </div>
    `;

    return;

  }


  data.forEach(item => {

    const card =
      document.createElement("a");


    card.className = "card";


    card.href =
      "content.html?id=" +
      encodeURIComponent(item.id);


    card.innerHTML = `

      <div class="thumbnail">

        <img
          src="${item.image}"
          alt="${item.title}"
          loading="lazy"
        >

      </div>


      <div class="card-info">

        <div class="card-title">
          ${item.title}
        </div>


        <div class="card-meta">

          <span>
            ${item.size}
          </span>

          <span>
            ${item.views || 0} views
          </span>

        </div>

      </div>

    `;


    grid.appendChild(card);

  });

}


function sortContents(type) {

  document
    .querySelectorAll(".sort-buttons button")
    .forEach(btn =>
      btn.classList.remove("active")
    );


  if (type === "recent") {

    document
      .getElementById("recentBtn")
      .classList.add("active");

    currentContents =
      [...contents];

  }


  if (type === "views") {

    document
      .getElementById("viewsBtn")
      .classList.add("active");

    currentContents =
      [...contents].sort(
        (a, b) =>
          (b.views || 0) -
          (a.views || 0)
      );

  }


  if (type === "az") {

    document
      .getElementById("azBtn")
      .classList.add("active");

    currentContents =
      [...contents].sort(
        (a, b) =>
          a.title.localeCompare(b.title)
      );

  }


  renderContents(currentContents);

}


document
  .getElementById("search")
  .addEventListener("input", function () {

    const keyword =
      this.value
        .toLowerCase()
        .trim();


    const filtered =
      currentContents.filter(item =>
        item.title
          .toLowerCase()
          .includes(keyword)
      );


    renderContents(filtered);

  });


renderContents(currentContents);

</script>

</body>
</html>
