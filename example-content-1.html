<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Example Content 1</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0d0e12;
            color: #f5f5f5;
        }

        header {
            height: 70px;
            border-bottom: 1px solid #24262d;
            background: #101116;

            display: flex;
            align-items: center;
        }

        .header-inner {
            width: 100%;
            max-width: 1000px;
            margin: auto;
            padding: 0 20px;
        }

        .logo {
            font-size: 21px;
            font-weight: bold;
        }

        main {
            max-width: 800px;
            margin: auto;
            padding: 50px 20px 80px;
        }

        .back {
            display: inline-block;
            color: #9295a0;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .back:hover {
            color: white;
        }

        .thumbnail {
            width: 100%;
            aspect-ratio: 16 / 9;

            background: #22252e;
            border-radius: 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #777b86;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 15px;
        }

        .description {
            color: #9295a0;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .info {
            background: #15171d;
            border: 1px solid #292c34;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #272a31;
        }

        .row:last-child {
            border-bottom: none;
        }

        .label {
            color: #858893;
        }

        .value {
            color: white;
        }

        .button {
            display: block;
            width: 100%;

            padding: 15px;

            text-align: center;

            background: #292c34;
            border: 1px solid #3a3d46;
            border-radius: 9px;

            color: white;
            font-weight: bold;
        }

        .button:hover {
            background: #363a44;
        }

        footer {
            border-top: 1px solid #24262d;
            padding: 30px;
            text-align: center;
            color: #6f727c;
            font-size: 13px;
        }

        @media (max-width: 600px) {

            main {
                padding-top: 35px;
            }

            h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="header-inner">
        <div class="logo">
            MY WEBSITE
        </div>
    </div>
</header>

<main>

    <a href="index.html" class="back">
        ← Back to home
    </a>

    <div class="thumbnail">
        THUMBNAIL
    </div>

    <h1>
        Example Content 1
    </h1>

    <p class="description">
        This is the description for this content.
        More information about the content can be displayed here.
    </p>

    <div class="info">

        <div class="row">
            <span class="label">Size</span>
            <span class="value">88 GB</span>
        </div>

        <div class="row">
            <span class="label">Views</span>
            <span class="value">1,200</span>
        </div>

        <div class="row">
            <span class="label">Added</span>
            <span class="value">September 1, 2026</span>
        </div>

    </div>

    <a href="#" class="button">
        Access Content
    </a>

</main>

<footer>
    © 2026 My Website
</footer>

</body>
</html>
