<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Content</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #0d0e12;
    color: #f1f1f1;
    font-family: Arial, Helvetica, sans-serif;
}

a {
    text-decoration: none;
    color: inherit;
}


/* HEADER */

header {
    height: 70px;
    border-bottom: 1px solid #24262d;
    background: #101116;
    display: flex;
    align-items: center;
}

.header-inner {
    width: 100%;
    max-width: 1200px;
    margin: auto;
    padding: 0 20px;
}

.logo {
    font-size: 20px;
    font-weight: bold;
}


/* CONTAINER */

.container {
    width: 100%;
    max-width: 1100px;
    margin: auto;
    padding: 0 20px 60px;
}


/* BACK HOME */

.back-home {
    display: inline-block;
    margin-top: 40px;
    margin-bottom: 28px;
    color: #999;
    font-size: 15px;
}

.back-home:hover {
    color: #fff;
}


/* THUMBNAIL */

.thumbnail {
    width: 100%;
    border-radius: 12px;
    overflow: hidden;
    background: #20232b;
    margin-bottom: 28px;
}

.thumbnail img {
    width: 100%;
    height: auto;
    max-height: 700px;
    display: block;
    object-fit: cover;
}


/* TITLE */

h1 {
    font-size: 32px;
    margin-bottom: 15px;
}


/* DESCRIPTION */

.description {
    color: #999;
    font-size: 16px;
    margin-bottom: 30px;
}


/* INFO */

.info {
    background: #191a20;
    border: 1px solid #292c34;
    border-radius: 12px;
    padding: 18px 22px;
    margin-bottom: 30px;
}

.row {
    display: flex;
    justify-content: space-between;
    padding: 14px 0;
    border-bottom: 1px solid #292c34;
}

.row:last-child {
    border-bottom: none;
}

.label {
    color: #888;
}

.value {
    color: #f1f1f1;
    font-weight: bold;
}


/* ACCESS BUTTON */

.button {
    display: block;
    width: 100%;
    padding: 17px;
    background: #f1f1f1;
    color: #111318;
    text-align: center;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
}

.button:hover {
    opacity: .9;
}


/* ERROR */

.error {
    text-align: center;
    padding: 80px 20px;
    color: #999;
}

.error h1 {
    margin-bottom: 15px;
}


/* MOBILE */

@media (max-width: 600px) {

    .container {
        padding: 0 15px 45px;
    }

    .back-home {
        margin-top: 30px;
        margin-bottom: 22px;
    }

    h1 {
        font-size: 28px;
    }

    .description {
        font-size: 15px;
    }

    .thumbnail {
        border-radius: 10px;
    }

    .info {
        padding: 15px 18px;
    }

}

</style>

</head>


<body>


<header>

    <div class="header-inner">

        <div class="logo">
            ONLYOFNLEAKS.COM
        </div>

    </div>

</header>


<main class="container" id="page">

    <!-- CONTENT WILL LOAD AUTOMATICALLY -->

</main>


<!-- DATA ONLY FROM data.js -->

<script src="data.js"></script>


<script>

/*
 * Get content ID from URL
 */

const params =
    new URLSearchParams(window.location.search);

const id =
    params.get("id");


/*
 * Find content by ID
 */

const item =
    contents.find(content => content.id === id);


const page =
    document.getElementById("page");


/*
 * International date formatter
 * Example: September 1, 2026
 */

function formatDate(dateValue) {

    if (!dateValue) {

        dateValue = new Date();

    }

    const date =
        new Date(dateValue);


    if (isNaN(date.getTime())) {

        return dateValue;

    }


    return date.toLocaleDateString(
        "en-US",
        {
            year: "numeric",
            month: "long",
            day: "numeric"
        }
    );

}


/*
 * If content is not found
 */

if (!item) {

    page.innerHTML = `

        <div class="error">

            <h1>
                Content Not Found
            </h1>

            <p>
                The requested content does not exist.
            </p>

            <br>

            <a
                href="index.html"
                class="back-home"
            >
                ← Back to Home
            </a>

        </div>

    `;

}


/*
 * If content is found
 */

else {

    document.title =
        item.title + " - " + item.size;


    /*
     * Use added date from data.js.
     * If no added date exists,
     * use today's date automatically.
     */

    const addedDate =
        formatDate(item.added);


    page.innerHTML = `

        <a
            href="index.html"
            class="back-home"
        >
            ← Back to Home
        </a>


        <div class="thumbnail">

            <img
                src="${item.image}"
                alt="${item.title}"
            >

        </div>


        <h1>
            ${item.title}
        </h1>


        <p class="description">
            ${item.title} collection.
        </p>


        <div class="info">

            <div class="row">

                <span class="label">
                    Size
                </span>

                <span class="value">
                    ${item.size}
                </span>

            </div>


            <div class="row">

                <span class="label">
                    Added
                </span>

                <span class="value">
                    ${addedDate}
                </span>

            </div>

        </div>


        <a
            href="${item.link}"
            class="button"
            target="_blank"
            rel="noopener noreferrer"
        >
            Access Content
        </a>

    `;

}

</script>


</body>

</html>
