<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JUDUL - UKURAN</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #0d0e12;
    color: #f1f1f1;
    font-family: Arial, sans-serif;
}

/* HEADER */
header {
    height: 64px;
    border-bottom: 1px solid #24262d;
    display: flex;
    align-items: center;
}

.header-inner {
    width: 100%;
    max-width: 1100px;
    margin: auto;
    padding: 0 20px;
}

.logo {
    font-size: 20px;
    font-weight: bold;
}

/* CONTAINER */
.container {
    width: 100%;
    max-width: 1100px;
    margin: auto;
    padding: 0 20px 50px;
}

/* BACK HOME */
.back-home {
    display: inline-block;
    margin-top: 40px;
    margin-bottom: 28px;
    color: #999;
    text-decoration: none;
    font-size: 15px;
}

.back-home:hover {
    color: #fff;
}

/* THUMBNAIL */
.thumbnail {
    width: 100%;
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 28px;
    background: #20232b;
}

.thumbnail img {
    display: block;
    width: 100%;
    height: auto;
    max-height: 650px;
    object-fit: cover;
}

/* TITLE */
h1 {
    font-size: 30px;
    margin-bottom: 18px;
}

/* DESCRIPTION */
.description {
    color: #999;
    font-size: 16px;
    margin-bottom: 32px;
}

/* INFO BOX */
.info {
    background: #191a1f;
    border: 1px solid #292b32;
    border-radius: 12px;
    padding: 18px 22px;
    margin-bottom: 30px;
}

.row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 0;
    border-bottom: 1px solid #292b32;
}

.row:last-child {
    border-bottom: none;
}

.label {
    color: #888;
}

.value {
    color: #f1f1f1;
    font-weight: 500;
}

/* ACCESS BUTTON */
.button {
    display: block;
    width: 100%;
    padding: 16px;
    background: #f1f1f1;
    color: #111;
    text-align: center;
    text-decoration: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
}

.button:hover {
    background: #dcdcdc;
}

/* MOBILE */
@media (max-width: 600px) {

    .container {
        padding: 0 18px 40px;
    }

    .back-home {
        margin-top: 40px;
        margin-bottom: 28px;
    }

    .thumbnail {
        border-radius: 10px;
    }

    h1 {
        font-size: 28px;
    }

    .description {
        font-size: 15px;
    }

    .info {
        padding: 15px 18px;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-inner">
        <div class="logo">MY WEBSITE</div>
    </div>
</header>

<main class="container">

    <!-- BACK TO HOME -->
    <a href="index.html" class="back-home">
        ← Back to home
    </a>

    <!-- THUMBNAIL -->
    <div class="thumbnail">
        <img
            src="URL_THUMBNAIL"
            alt="JUDUL"
        >
    </div>

    <!-- TITLE -->
    <h1>
        JUDUL
    </h1>

    <!-- DESCRIPTION -->
    <p class="description">
        JUDUL collection.
    </p>

    <!-- INFORMATION -->
    <div class="info">

        <div class="row">
            <span class="label">Size</span>
            <span class="value">UKURAN</span>
        </div>

        <div class="row">
            <span class="label">Views</span>
            <span class="value">0</span>
        </div>

        <div class="row">
            <span class="label">Added</span>
            <span class="value">September 1, 2026</span>
        </div>

    </div>

    <!-- ACCESS -->
    <a
        href="URL_LINK"
        class="button"
    >
        Access Content
    </a>

</main>

</body>
</html>
