<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JUDUL - UKURAN</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #0d0e12;
    color: #f1f1f1;
    font-family: Arial, sans-serif;
}

header {
    height: 64px;
    border-bottom: 1px solid #24262d;
    display: flex;
    align-items: center;
}

.header-inner {
    width: 100%;
    max-width: 1100px;
    margin: auto;
    padding: 0 20px;
}

.logo {
    font-size: 20px;
    font-weight: bold;
}

.container {
    width: 100%;
    max-width: 900px;
    margin: auto;
    padding: 40px 20px 70px;
}

.thumbnail {
    width: 100%;
    aspect-ratio: 2 / 3;
    background: #22252e;
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 28px;
}

.thumbnail img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.placeholder {
    color: #6f727d;
    font-size: 14px;
}

h1 {
    font-size: 30px;
    margin-bottom: 12px;
}

.description {
    color: #9a9da7;
    font-size: 16px;
    margin-bottom: 25px;
}

.info {
    background: #17181d;
    border: 1px solid #292c34;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 28px;
}

.row {
    display: flex;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid #292c34;
}

.row:last-child {
    border-bottom: none;
}

.label {
    color: #858893;
}

.value {
    color: #f1f1f1;
}

.access {
    display: block;
    width: 100%;
    padding: 15px;
    background: #292c34;
    color: white;
    text-align: center;
    text-decoration: none;
    border-radius: 10px;
    font-weight: bold;
}

.access:hover {
    background: #353943;
}

footer {
    border-top: 1px solid #24262d;
    text-align: center;
    padding: 30px 20px;
    color: #6f727d;
    font-size: 13px;
}

@media (max-width: 650px) {
    .container {
        padding: 25px 18px 50px;
    }

    h1 {
        font-size: 26px;
    }

    .thumbnail {
        aspect-ratio: 2 / 3;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-inner">
        <div class="logo">MY WEBSITE</div>
    </div>
</header>

<main class="container">

    <div class="thumbnail">
        <img src="URL_THUMBNAIL" alt="JUDUL">
    </div>

    <h1>JUDUL</h1>

    <p class="description">
        JUDUL collection.
    </p>

    <div class="info">

        <div class="row">
            <span class="label">Size</span>
            <span class="value">UKURAN</span>
        </div>

        <div class="row">
            <span class="label">Views</span>
            <span class="value">0</span>
        </div>

        <div class="row">
            <span class="label">Added</span>
            <span class="value">September 1, 2026</span>
        </div>

    </div>

    <a class="access" href="URL_LINK">
        Access Content
    </a>

</main>

<footer>
    © 2026 My Website
</footer>

</body>
</html>
